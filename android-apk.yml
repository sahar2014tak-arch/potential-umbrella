name: Build Lost Kingdom Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p build

      - name: Import project resources
        run: godot --headless --path . --editor --quit

      - name: Export Android debug APK
        run: godot --headless --path . --export-debug "Android" build/LostKingdom-debug.apk

      - name: Save APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lost-Kingdom-Android-APK
          path: build/LostKingdom-debug.apk
          if-no-files-found: error
