
name: Build Lost Kingdom Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          set -eu
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'LostKingdom_Android_Release_Candidate.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Game ZIP file not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          PROJECT_FILE="$(find extracted -type f -name project.godot -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "project.godot not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.4.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" build/LostKingdom-debug.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Lost-Kingdom-Android-APK
          path: build/LostKingdom-debug.apk
