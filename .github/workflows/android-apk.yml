
name: Build Lost Kingdom Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Find and extract game project
        run: |
          set -eu

          PROJECT_FILE="$(find . -type f -name project.godot -not -path './.git/*' -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "No project.godot or ZIP file found"
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted

            PROJECT_FILE="$(find extracted -type f -name project.godot -print -quit)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "project.godot not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Import project
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" build/LostKingdom-debug.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Lost-Kingdom-Android-APK
          path: build/LostKingdom-debug.apk
          if-no-files-found: error
