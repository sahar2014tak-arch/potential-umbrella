name: Build Lost Kingdom Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p build

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/LostKingdom-debug.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Lost-Kingdom-Android-APK
          path: build/LostKingdom-debug.apk
